name: Build App

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
      security-events: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify secrets
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ -z "$DB_USER" ]; then
            echo "Error: DB_USER secret is not set."
            exit 1
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo "Error: DB_PASSWORD secret is not set."
            exit 1
          fi
          if [ -z "$DB_NAME" ]; then
            echo "Error: DB_NAME secret is not set."
            exit 1
          fi

      - name: Start PostgreSQL service
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: docker compose -f docker-compose.yaml up -d --wait database

      - name: Initialize CodeQL
        if: ${{ !env.ACT }}
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build the application and run tests
        run: ./gradlew clean build --no-daemon

      - name: Upload application JAR
        if: ${{ github.event_name == 'push' && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/**
          retention-days: 7

      - name: Perform CodeQL Analysis
        if: ${{ !env.ACT }}
        uses: github/codeql-action/analyze@v4

      - name: Stop PostgreSQL service
        if: always()
        run: docker compose -f docker-compose.yaml down

  container-security:
    name: Container security (Trivy)
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download application JAR
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: build/libs

      # Solo para probar localmente con act, ya que no descargamos el artefacto.
      #-----------------------------------------
      - name: Set up JDK 21 for act
        if: ${{ env.ACT }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Grant execute permission for Gradle wrapper
        if: ${{ env.ACT }}
        run: chmod +x ./gradlew

      - name: Build JAR for act
        if: ${{ env.ACT }}
        run: ./gradlew clean assemble --no-daemon
      #-----------------------------------------

      - name: Build docker image
        run: docker build -t acm_ecommerce_java_avanzado:${{ github.sha }} .

      # Escaneo local con act
      - name: Scan Docker image with Trivy using act
        if: ${{ env.ACT }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 image \
            --format table \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            acm_ecommerce_java_avanzado:${{ github.sha }}

      # Escaneo en GitHub Actions
      - name: Scan Docker image with Trivy
        if: ${{ !env.ACT }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acm_ecommerce_java_avanzado:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push docker image to GHCR
        if: ${{ github.event_name == 'push' && !env.ACT }}
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker tag acm_ecommerce_java_avanzado:${{ github.sha }} "$REGISTRY/${IMAGE_NAME}:${{ github.sha }}"
          docker push "$REGISTRY/${IMAGE_NAME}:${{ github.sha }}"

  sonar-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Analize code with Sonarqube
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}